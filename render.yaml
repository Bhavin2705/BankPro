services:
  - type: web
    name: bankpro-backend
    env: node
    plan: free
    rootDir: backend
    buildCommand: npm install
    startCommand: node server.js
    envVars:
      - key: NODE_ENV
        value: production
      - key: COOKIE_SAME_SITE
        value: None
      - key: FRONTEND_URL
        value: https://bankpro.vercel.app
      - key: FRONTEND_URLS
        value: https://bankpro.vercel.app,https://frontend-theta-six-54.vercel.app,http://localhost:5173
      - key: MONGODB_URI
        sync: false
      - key: JWT_SECRET
        sync: false
      - key: JWT_REFRESH_SECRET
        sync: false
      - key: RESEND_API_KEY
        sync: false
      - key: RESEND_FROM
        value: "BankPro <onboarding@resend.dev>"
      - key: UPSTASH_REDIS_REST_URL
        sync: false
      - key: UPSTASH_REDIS_REST_TOKEN
        sync: false
